[tool.poetry]
name = "autonomous-motor-od-adjudicator"
version = "0.1.0"
description = "Autonomous Motor OD Claim Adjudicator & Surveyor Assistant"
authors = ["AI Engineer"]

[tool.poetry.dependencies]
redis = "^5.0.0"
python = "^3.10"
# Core AI & LangChain
langchain = "^0.3.0"
langchain-openai = "^0.2.0"
langchain-community = "^0.3.0"
langgraph = "^0.2.0"
# Vector Store
faiss-cpu = "^1.8.0"
# PII Masking
presidio-analyzer = "^2.2.35"
presidio-anonymizer = "^2.2.35"
spacy = "^3.7.0" # Required backend for Presidio
# Memory
mem0ai = "^0.1.16"
# Validation & Guardrails
pydantic = "^2.7.0"
guardrails-ai = "^0.5.0"
# UI & Utils
streamlit = "^1.34.0"
pyyaml = "^6.0.1"
python-dotenv = "^1.0.1"
pypdf = "^4.2.0"
pdfplumber = "^0.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"