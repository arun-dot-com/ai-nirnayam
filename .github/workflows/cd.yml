name: "CD: Build, Push & Deploy"

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  DOCKERHUB_USERNAME: arundotcom
  IMAGE_NAME: nirnayam
  PYTHON_VERSION: "3.12"

jobs:
  # ==========================================
  # STAGE 1: Pre-Deployment Validation
  # ==========================================
  pre-deploy-validation:
    name: "🔒 Pre-Deploy Validation"
    runs-on: ubuntu-latest
    env:
      REDIS_URL: ${{ secrets.REDIS_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGCHAIN_TRACING_V2: "false"
      LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run full test suite
        run: python -m pytest tests/ -v --tb=short

  # ==========================================
  # STAGE 2: Docker Build & Push to Registry
  # ==========================================
  docker-build:
    name: "🐳 Docker Build & Push"
    runs-on: ubuntu-latest
    needs: [pre-deploy-validation]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest
        run: echo "📦 Image pushed with digest ${{ steps.meta.outputs.tags }}"

  # ==========================================
  # STAGE 3: Deployment Verification
  # ==========================================
  verify-deployment:
    name: "✅ Deployment Verification"
    runs-on: ubuntu-latest
    needs: [docker-build]
    env:
      # Map the secret to an env variable so we can use it in the 'if' condition
      STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
    steps:
      - name: Verify Docker Hub image exists
        run: |
          echo "🔍 Checking Docker Hub for image..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}/tags/latest")
          if [ "$HTTP_STATUS" == "200" ]; then
            echo "✅ Image verified on Docker Hub: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
          else
            echo "❌ Image not found on Docker Hub (HTTP $HTTP_STATUS)"
            exit 1
          fi

      - name: Verify Streamlit Cloud app is accessible
        # Use the env variable in the condition instead of secrets
        if: ${{ env.STREAMLIT_APP_URL != '' }}
        run: |
          echo "🔍 Checking Streamlit Cloud app health..."
          sleep 30
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.STREAMLIT_APP_URL }}/_stcore/health")
          if [ "$HTTP_STATUS" == "200" ]; then
            echo "✅ Streamlit Cloud app is healthy!"
          else
            echo "⚠️ Streamlit Cloud health check returned HTTP $HTTP_STATUS (may still be deploying)"
          fi

  # ==========================================
  # STAGE 4: Release Notification (Tags Only)
  # ==========================================
  create-release:
    name: "🏷️ Create GitHub Release"
    runs-on: ubuntu-latest
    needs: [verify-deployment]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 🚀 Nirnayam Release ${{ github.ref_name }}
            
            ### Docker Image
            ```bash
            docker pull ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```
            
            ### Run Locally
            ```bash
            docker compose up -d
            ```
            
            ### Changes
            See commit history for details.