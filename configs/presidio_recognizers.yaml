# Custom Regex Patterns for Indian PII & Vehicle Identifiers
recognizers:
  - name: "IndianDLRecognizer"
    entity_type: "IN_DRIVING_LICENCE"
    # Matches formats like DL-1420110012345 or MH0220110012345
    patterns:
      - name: "dl_standard"
        regex: "\\b[A-Z]{2}-?\\d{13}\\b"
        score: 0.8
      - name: "dl_old_format"
        regex: "\\b[A-Z]{2}\\d{2}\\s?\\d{11}\\b"
        score: 0.7
    context: ["driving licence", "dl no", "dl number", "licence"]

  - name: "IndianRCRecognizer"
    entity_type: "IN_VEHICLE_RC"
    # Matches formats like MH 02 AB 1234, DL 3C AB 9999, KA03MN1234
    patterns:
      - name: "rc_standard"
        regex: "\\b[A-Z]{2}\\s?\\d{1,2}\\s?[A-Z]{1,3}\\s?\\d{4}\\b"
        score: 0.9
    context: ["registration", "rc", "rc number", "vehicle number", "vahan"]

  - name: "VINChassisRecognizer"
    entity_type: "IN_VIN_CHASSIS"
    # Standard 17-character VIN (Excludes I, O, Q)
    patterns:
      - name: "vin_17char"
        regex: "\\b[A-HJ-NPR-Z0-9]{17}\\b"
        score: 0.95
    context: ["chassis", "vin", "chassis number", "vin number"]

  - name: "IndianPANRecognizer"
    entity_type: "IN_PAN"
    # Standard 10-character PAN
    patterns:
      - name: "pan_standard"
        regex: "\\b[A-Z]{5}\\d{4}[A-Z]\\b"
        score: 0.85
    context: ["pan", "pan card", "permanent account number"]

  - name: "IndianPhoneRecognizer"
    entity_type: "IN_PHONE_NUMBER"
    # Indian mobile numbers (10 digits, optional +91)
    patterns:
      - name: "mobile_standard"
        regex: "\\b(?:\\+?91|0)?[-\\s]?\\d{10}\\b"
        score: 0.6
    context: ["phone", "mobile", "contact", "number"]